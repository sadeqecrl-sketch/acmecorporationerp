<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Company · Secure Sign-in Preview</title>
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#172b25;background:#eef3f1;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}.wrap{min-height:100vh;display:grid;place-items:center;padding:32px 20px;background:radial-gradient(circle at 50% 20%,#fff 0,#f6f8f7 45%,#eaf0ed 100%)}.card{width:min(100%,470px);padding:38px 40px 32px;background:white;border:1px solid #e1e8e4;border-radius:18px;box-shadow:0 22px 70px #19382b15}.brand{display:flex;align-items:center;gap:11px;color:#195a46;font-size:11px;font-weight:800;letter-spacing:.12em}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#143c32;color:#d7f2e5;font-size:21px}.tag{margin:25px 0 4px;color:#167653;font-size:10px;font-weight:800;letter-spacing:.16em}h1{margin:7px 0 8px;font-size:30px;letter-spacing:-.04em}.muted{margin:0 0 26px;color:#697870;font-size:14px;line-height:1.65}.field{display:grid;gap:8px;margin:17px 0;color:#33483f;font-size:12px;font-weight:700}input{height:46px;width:100%;padding:0 13px;border:1px solid #ccd9d2;border-radius:8px;background:white;color:#172b25;font:inherit;font-weight:400;outline:none}input:focus{border-color:#218565;box-shadow:0 0 0 3px #21856520}.pass{display:flex;position:relative}.pass input{padding-right:60px}.show{position:absolute;right:9px;top:9px;border:0;background:transparent;color:#246449;font-weight:700;cursor:pointer}.primary{width:100%;height:47px;margin-top:8px;border:0;border-radius:8px;background:#176b52;color:white;font-size:14px;font-weight:750;cursor:pointer}.primary:hover{background:#105741}.links{display:flex;justify-content:space-between;align-items:center;margin:16px 0 9px}.link{padding:3px 0;border:0;background:none;color:#176b52;font-size:12px;font-weight:700;cursor:pointer}.note{min-height:22px;margin:13px 0;color:#46675a;font-size:12px;line-height:1.5}.hint{margin-top:21px;padding:13px 14px;border-radius:9px;background:#f2f7f4;color:#53675d;font-size:11px;line-height:1.6}.shield{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:50%;background:#e0f1e9;color:#176b52;margin-right:6px;font-weight:900}.demo{position:fixed;right:18px;bottom:16px;padding:9px 12px;border:1px solid #d6e2dc;border-radius:30px;background:#fff;color:#5d7167;font-size:10px;font-weight:700;letter-spacing:.08em}.qr{width:168px;height:168px;margin:6px auto 18px;display:grid;place-items:center;border:1px solid #e1e8e4;border-radius:10px;background:white}.qr svg{width:140px;height:140px}.eyebrow{color:#176b52;font-size:10px;font-weight:800;letter-spacing:.14em}.back{margin-top:11px}.success{padding:15px;border:1px solid #cee6d9;border-radius:9px;background:#eff9f3;color:#245a42;font-size:13px;line-height:1.55}footer{margin-top:20px;color:#92a098;text-align:center;font-size:10px}@media(max-width:520px){.card{padding:30px 24px}.wrap{padding:16px}h1{font-size:26px}.demo{right:10px;bottom:9px}}
</style></head><body><main class="wrap"><section class="card" id="screen"></section></main><div class="demo">INTERACTIVE PREVIEW · NO ACCOUNT CONNECTED</div>
<script>
const screen=document.getElementById("screen");
function signIn(message=""){screen.innerHTML='<div class="brand"><span class="mark">C</span><span>YOUR COMPANY · BUSINESS WORKSPACE</span></div><p class="tag">SECURE SIGN-IN</p><h1>Sign in</h1><p class="muted">Use your named company account to continue.</p><label class="field">Email address<input type="email" autocomplete="email" placeholder="you@company.com"></label><label class="field">Password<span class="pass"><input id="pw" type="password" autocomplete="current-password" placeholder="Enter your password"><button class="show" type="button" onclick="togglePw(this)">Show</button></span></label><button class="primary" onclick="mfa()">Sign in</button><div class="links"><button class="link" onclick="forgot()">Forgot password?</button><button class="link" onclick="signup()">First owner setup</button></div><p class="note" role="status">'+message+'</p><div class="hint"><span class="shield">✓</span> Owners and administrators verify with an authenticator code. Your password is never shown to your company team.</div><footer>Encrypted connection · Organization access controls</footer>'}
function togglePw(button){const p=document.getElementById("pw");p.type=p.type==="password"?"text":"password";button.textContent=p.type==="password"?"Show":"Hide"}
function forgot(){screen.innerHTML='<div class="brand"><span class="mark">C</span><span>YOUR COMPANY · ACCOUNT RECOVERY</span></div><p class="tag">PASSWORD HELP</p><h1>Reset your password</h1><p class="muted">If an account matches this email, a secure reset link will arrive shortly.</p><label class="field">Email address<input type="email" placeholder="you@company.com"></label><button class="primary" onclick="resetSent()">Send reset link</button><button class="link back" onclick="signIn()">Back to sign in</button><p class="note" role="status"></p><div class="hint">This message is the same whether or not the email is registered, to protect account privacy.</div>'}
function resetSent(){document.querySelector(".note").textContent="If an account matches this email, a reset link will arrive shortly."}
function mfa(){screen.innerHTML='<div class="brand"><span class="mark">C</span><span>YOUR COMPANY · ACCOUNT PROTECTION</span></div><p class="tag">MULTI-FACTOR AUTHENTICATION</p><h1>Verify it is you</h1><p class="muted">Enter the current 6-digit code from your authenticator app to continue.</p><label class="field">Authenticator code<input inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></label><button class="primary" onclick="done()">Verify and continue</button><button class="link back" onclick="signIn()">Back</button><div class="hint"><span class="shield">✓</span> A second sign-in step is required for elevated roles.</div>'}
function enroll(){screen.innerHTML='<div class="brand"><span class="mark">C</span><span>YOUR COMPANY · ACCOUNT PROTECTION</span></div><p class="tag">FIRST-TIME ADMIN SETUP</p><h1>Protect your account</h1><p class="muted">Scan the setup code using an authenticator app, then enter the 6-digit code it generates.</p><div class="qr"><svg viewBox="0 0 21 21" aria-label="Illustrative QR code"><rect width="21" height="21" fill="white"/><path fill="#143c32" d="M1 1h7v7H1zm2 2v3h3V3zm10-2h7v7h-7zm2 2v3h3V3zM1 13h7v7H1zm2 2v3h3v-3zm8-8h2v2h-2zm3 2h2v2h-2zm-4 2h2v2h-2zm4 2h2v2h-2zm3-3h2v2h-2zm-7 5h2v2h-2zm4 1h2v2h-2zm4-2h2v2h-2zm-8 4h2v2h-2zm7-1h2v2h-2z"/></svg></div><label class="field">Authenticator code<input inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></label><button class="primary" onclick="done()">Enable protection</button><button class="link back" onclick="signIn()">Cancel demo</button><div class="hint">In the real app, the QR code is private to your signed-in account. This preview uses a decorative sample.</div>'}
function signup(){screen.innerHTML='<div class="brand"><span class="mark">C</span><span>YOUR COMPANY · FIRST OWNER SETUP</span></div><p class="tag">INITIAL SETUP</p><h1>Create owner account</h1><p class="muted">This is only for the first workspace owner. New staff should be invited by an administrator.</p><label class="field">Full name<input autocomplete="name" placeholder="Your name"></label><label class="field">Work email<input type="email" autocomplete="email" placeholder="you@company.com"></label><label class="field">Password<input type="password" minlength="12" autocomplete="new-password" placeholder="At least 12 characters"></label><button class="primary" onclick="sent()">Create owner account</button><button class="link back" onclick="signIn()">Back to sign in</button><p class="note"></p><div class="hint">After the first owner is set up, public sign-up is switched off.</div>'}
function sent(){document.querySelector(".note").textContent="Demo only: the live app sends an email confirmation before sign-in."}
let demoCompany="Your Company";
function done(){screen.innerHTML='<div class="brand"><span class="mark">Y</span><span>YOUR COMPANY · SIGN-IN PREVIEW</span></div><p class="tag">DEMO WORKSPACE</p><h1>Sign-in flow complete</h1><div class="success">This interactive preview does not authenticate or save anything. In the connected app, your company profile controls the workspace name and contact details.</div><button class="primary" onclick="profile()">Preview company profile</button><button class="link back" onclick="signIn()">Return to sign in</button><footer>Preview only · No credentials or codes are sent</footer>'}
function profile(){screen.innerHTML='<div class="brand"><span class="mark">Y</span><span>YOUR COMPANY · COMPANY PROFILE</span></div><p class="tag">COMPANY SETTINGS</p><h1>Company information</h1><p class="muted">Set the details your team sees in the workspace.</p><label class="field">Company name<input id="co-name" value="Your Company"></label><label class="field">Street address<input value="Enter your business address"></label><label class="field">City<input value="Dhaka"></label><label class="field">Country<input value="Bangladesh"></label><label class="field">Business email<input type="email" placeholder="office@company.com"></label><label class="field">Phone<input type="tel" placeholder="+880"></label><label class="field">Website<input type="url" placeholder="https://"></label><button class="primary" onclick="saveCompany()">Save company profile</button><button class="link back" onclick="done()">Back to preview</button>';document.getElementById('co-name').value=demoCompany;}
function saveCompany(){demoCompany=document.getElementById("co-name").value.trim()||"Your Company";signIn("Company details saved in this preview.");const label=document.querySelector(".brand span:last-child"),mark=document.querySelector(".brand .mark");if(label)label.textContent=demoCompany.toUpperCase()+" · BUSINESS WORKSPACE";if(mark)mark.textContent=demoCompany.charAt(0).toUpperCase();document.title=demoCompany+" · Sign-in Preview";}signIn();
</script></body></html>
